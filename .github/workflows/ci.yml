# Continuous Integration: runs on every push and every pull request.
# Lint -> unit tests (vitest) -> production build. A red check blocks the merge.
# Continuous Delivery: each merge to main is also packaged as a downloadable build
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      # The app works in Singapore time (see lib/dates.js), and so do the date tests.
      # GitHub's servers default to UTC, which shifts late-evening timestamps to the next day.
      TZ: Asia/Singapore
    defaults:
      run:
        working-directory: csit314-sdm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: csit314-sdm/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Continuous Delivery: every merge to main is packaged as a ready-to-run build.
      # Download it from the run's "Artifacts" section, then run `npm ci --omit=dev && npm start`.
      - name: Package release build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tar -czf ../csit314-sdm-build.tar.gz --exclude=.next/cache .next public package.json package-lock.json next.config.*

      - name: Upload release build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: csit314-sdm-build-${{ github.sha }}
          path: csit314-sdm-build.tar.gz
          retention-days: 30
